# Dymola baseline for Requirements (MR_ prefix; the OpenModelica list beside
# this file shares ReferenceResults/ under MR_OM_). Every enabled case has a
# Dymola reference: 71 stored with Dymola 2026x (2026-09/10), and since
# 2026-11-19 the other 20 with Dymola 2027x and a full license -- the 8 examples
# the 2026x license refused ("too complex for the current license"),
# SignalsFromFile, StepResponse_SecondOrder, CheckHeatExchanger and the
# 0.12.0/0.13.0 examples, which until then carried Modelon Impact's reference.
# Two cases run under Dassl (StepResponse_SecondOrder, Margin_StableSignal); see
# their comments.
#
# Auto-generated by generate_cases_from_experiment.py on 2026-09-13 from
# Requirements's own experiment() and vendor annotations -- see the script's
# docstring for what each key came from. Review every case before
# enabling: an annotation says how its author simulated, not what is
# worth checking.
library: Requirements
workspace: n/a
custom_function: dynamic
tolerance: 0.001

sources:
  default:
    backend: dymola
    method: Cvode
    libraries: [../../package.mo]

cases:
  - name: MR_Examples_AircraftRequirements_LimitedCabinAltitudeRateOfChange
