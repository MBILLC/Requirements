    # No Tolerance in the annotation: rtol defaults to 1e-6 here, not Dymola's 1e-4.
    # No top-level outputs: `variables:` is the --variables glob given to the generator.
    enabled: true
    model: Requirements.Examples.AircraftRequirements.LimitedCabinAltitudeRateOfChange
    start_time: 0.0
    final_time: 100.0
    ncp: 500
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y"]

