    # against the closed forms inside the example; the stored `*.y`, `*.margin` and
    # `*.value` trajectories are the reference.
    # Radau5ODE here (the owner's call, 2026-09-16): the sampled blocks restart the solver at every
    # millisecond sample; OCT's CVode then reads the peak 0.3 % low at rtol 1e-6 and 0.9 % at 1e-4
    # (the comparison run's) and the time metrics up to 3 ms off, beyond the funnel against the
    # dassl reference (28/44 checks), where Radau5ODE reproduces the closed form at 1e-4, 1e-6 and
    # 1e-8 alike (overshoot 16.303 %, rise 0.32752 s, zeta 0.5000). The solver is a simulation
    # option of Impact's dynamic custom function (`solver:` on the case, passed through by the
    # harness); the reference is solved at 1e-8.
    enabled: true
    model: Requirements.Examples.Elementary.StepResponse.SecondOrder
    start_time: 0.0
    final_time: 6.0
    ncp: 6000
    rtol: 1.0e-08
    solver: Radau5ODE
    modifiers: {}
    variables: [time, "*.y", "*.margin", "*.value"]

  - name: MR_Examples_Elementary_StepResponse_Disturbance
    # Added 2026-09-16 with the step-response blocks (library 0.10.0, ModCheck plan
    # phase 15b): the running metrics and the checks' Property and margin asserted
    # against the closed forms inside the example; the stored `*.y`, `*.margin` and
    # `*.value` trajectories are the reference.
    enabled: true
    model: Requirements.Examples.Elementary.StepResponse.Disturbance
    start_time: 0.0
    final_time: 6.0
    ncp: 6000
    rtol: 1.0e-08
    solver: Radau5ODE
    modifiers: {}
    variables: [time, "*.y", "*.margin", "*.value"]

  - name: MR_Examples_SteadyState_CheckHeatExchanger
    # Added 2026-10-16 with the example (library 0.11.1): the steady-state requirements of the
    # MSL heat exchanger at its nominal point, checked in a plain simulation. The requirement
    # properties are Undefined until the run has settled (t = 450 s) and Satisfied after; the
    # outlet and wall temperatures and the filtered rates that define "settled" are stored with
    # them, so a change in the plant shows up beside the change in the verdict.
    # Variables listed by name: a "*.y" glob would sweep in the heat exchanger's internals.
    # Reference from Impact itself (reference_from: impact), as for the five cases neither
    # Dymola nor OpenModelica could run when the composite list was built.
    enabled: true
    model: Requirements.Examples.SteadyState.CheckHeatExchanger
    start_time: 0.0
    final_time: 600.0
    ncp: 600
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "R*_*.property", T_out1, T_out2, T_wall_max, Q_transferred, derT_out1.y, derT_out2.y, printViolations.satisfaction]

  # --- Verify.ViolationStatistics (library 0.12.0, ModCheck plan §24), added 2026-10-19. Each example
  # asserts its statistics against closed-form values; the stored statistics outputs are the
  # reference, so a count, a duration or a worst margin that moves is caught like a verdict.
  # References from Impact itself (reference_from: impact); no other tool has run the 0.12.0 blocks yet.
  - name: MR_Examples_Elementary_ViolationStatistics_Sine
    # Four episodes of 10/3 s; the worst margin -2 between two output points (1 s interval), found
    # by the continuous method T = 0.01 s late and by the ratchet within 0.01.
    # Not compared: tLongestStart and tWorst. The four episodes are equally long and the four maxima
    # equally deep, so which one is reported moves by a period with the solver's last digits (it did,
    # at the 100x rtol re-simulation); the example asserts both modulo the period itself.
    enabled: true
    model: Requirements.Examples.Elementary.ViolationStatistics.Sine
    start_time: 0.0
    final_time: 35.0
    ncp: 35
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, during1.y, during1.margin, "*.nViolations", "*.totalDuration", "*.violatedFraction", "*.longestDuration", "*.worstMargin", "*.currentDuration", "*.episodeWorstMargin", "*.tEpisodeWorst"]

  - name: MR_Examples_Elementary_ViolationStatistics_Episodes
    # Five violations against mergeGap and minDuration, and a property applicable half of the time.
    enabled: true
    model: Requirements.Examples.Elementary.ViolationStatistics.Episodes
    start_time: 0.0
    final_time: 10.0
    ncp: 1000
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, p, q, "*.nViolations", "*.totalDuration", "*.violatedFraction", "*.longestDuration", "*.tLongestStart", "*.currentDuration"]

  - name: MR_Examples_Elementary_ViolationStatistics_Gating
    # MinDuration's provisional margin while Undecided is not the worst; 0 at 2.5 s is.
    enabled: true
    model: Requirements.Examples.Elementary.ViolationStatistics.Gating
    start_time: 0.0
    final_time: 5.0
    ncp: 500
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, minDuration.y, minDuration.margin, "*.nViolations", "*.totalDuration", "*.worstMargin", "*.tWorst"]

  - name: MR_Examples_Elementary_ViolationStatistics_RequirementLog
    # Verify.Requirement with computeStatistics: the embedded statistics are stored; the log's
    # Statistics lines are compared with Python's by verdict_acceptance.py (ModCheck).
    # Not compared: tWorst, for the reason given at the Sine case (the same sine).
    enabled: true
    model: Requirements.Examples.Elementary.ViolationStatistics.RequirementLog
    start_time: 0.0
    final_time: 35.0
    ncp: 35
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, during1.y, during1.margin, during2.y, "*.statistics.nViolations", "*.statistics.totalDuration", "*.statistics.longestDuration", "*.statistics.worstMargin"]

  - name: MR_Examples_Elementary_ViolationStatistics_YearSmooth
    # A year with hourly output: 366 episodes, the worst margin -2.99992 on 15 January; both methods.
    # DISABLED: a stored result keeps every event row (about 134,000 here, 62,700 events), so even
    # four variables make an 805 kB reference -- as much as the rest of the list. The example asserts
    # its closed-form values itself; run it by hand (22 s on Impact) after a change to the blocks.
    enabled: false
    model: Requirements.Examples.Elementary.ViolationStatistics.YearSmooth
    start_time: 0.0
    final_time: 31536000.0
    ncp: 8760
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, continuous.nViolations, continuous.totalDuration, continuous.worstMargin, ratchet.worstMargin]

  # Added 2026-10-20 with library 0.13.0: the check blocks ported from Buildings_Requirements
  # (modelica-buildings-requirements, M. Wetter, LBNL). The three Elementary examples are the
  # original validation models with the same instances; their verdicts were compared with the
  # originals' run in the same workspace at 3999 instants each, identical except Undecided (2)
  # -> Undefined (4) while a check does not apply. The two Margin examples assert the margins
  # in closed form. References from Impact: no Dymola / OpenModelica baseline exists yet.
  - name: MR_Examples_Elementary_ChecksInFixedWindow_WithinBand
    enabled: true
    model: Requirements.Examples.Elementary.ChecksInFixedWindow.WithinBand
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y", "*.margin"]

  - name: MR_Examples_Elementary_ChecksInFixedWindow_GreaterEqual
    enabled: true
    model: Requirements.Examples.Elementary.ChecksInFixedWindow.GreaterEqual
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y", "*.margin"]

  - name: MR_Examples_Elementary_ChecksInFixedWindow_StableSignal
    # tolerance 2e-2, not the list's 1e-3: rateAverage is the difference of the integral of |du/dt| over the
    # window, and at the CI's rtol factor of 100 (rtol 1e-4) the fast sine's final average (0.0177 1/s) moves by
    # 1.0e-4 (0.6 %), its margin (-0.0077) by 1.3 % -- the solver's tolerance on an integral that reaches 64 in the
    # hour, not a regression. At the reference's own rtol every check passes at 1e-3 (2026-10-20).
    enabled: true
    tolerance: 2.0e-2
    model: Requirements.Examples.Elementary.ChecksInFixedWindow.StableSignal
    start_time: 0.0
    final_time: 3600.0
    ncp: 720
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "staSig*.y", "staSig*.margin", "staSig*.rateAverage"]

  - name: MR_Examples_Elementary_Margin_Gated
    enabled: true
    model: Requirements.Examples.Elementary.Margin.Gated
    start_time: 0.0
    final_time: 20.0
    ncp: 2000
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y", "*.margin", "*.nViolations", "*.totalDuration", "*.worstMargin"]

  - name: MR_Examples_Elementary_Margin_StableSignal
    enabled: true
    model: Requirements.Examples.Elementary.Margin.StableSignal
    start_time: 0.0
    final_time: 150.0
    ncp: 1500
    rtol: 1.0e-06
    modifiers: {}
    variables: [time, "*.y", "*.margin", "*.rateAverage"]
