# Modelon Impact run of Requirements against a COMPOSITE reference:
# Dymola's baseline where Dymola could run the case, OpenModelica's where the
# Dymola license refused it, assembled from the two suites beside this
# folder (ReferenceResults/manifest.json records which tool each entry came
# from, and the report header names both). Cases neither tool could produce
# are marked in the manifest as skipped, with the reason, and are not run.
# The two single-window FFT examples set terminate1.delay so that Impact
# records the verdict it takes at the instant it terminates (README).
#
# Auto-generated by generate_cases_from_experiment.py on 2026-09-14 from
# Requirements's own experiment() and vendor annotations -- see the script's
# docstring for what each key came from. Review every case before
# enabling: an annotation says how its author simulated, not what is
# worth checking.
library: Requirements
workspace: requirements-redesign
custom_function: dynamic
tolerance: 0.001

sources:
  default:
    backend: impact
    workspace: requirements-redesign

cases:
  - name: MR_Examples_AircraftRequirements_LimitedCabinAltitudeRateOfChange
